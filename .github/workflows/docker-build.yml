name: Docker Build

run-name: Docker Build ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream tag to build and publish
        required: true
        type: string

jobs:
  build:
    name: Build and Push Multi-Arch Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout local fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout upstream tag and merge multi-arch branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/attestantio/vouch.git
          git fetch upstream --tags
          git checkout -B docker-build-base "refs/tags/${{ inputs.tag }}"
          git merge --no-edit origin/multi-arch-dockerfile

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: |
            linux/amd64
            linux/arm64
          tags: ghcr.io/${{ github.repository }}:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
